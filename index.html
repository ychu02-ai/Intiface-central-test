<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intiface 測試頁</title>
<style>
  :root {
    --bg: #111318;
    --panel: #1b1e26;
    --accent: #6ee7d0;
    --accent-dim: #2f6b5e;
    --text: #e8eaf0;
    --muted: #8a8f9c;
    --danger: #e0645a;
    --ok: #6ee7d0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    padding-bottom: 40px;
  }
  h1 {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .sub {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 20px;
  }
  .card {
    background: var(--panel);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .status-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 12px;
  }
  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .dot.connected { background: var(--ok); }
  #statusText { font-size: 0.95rem; }
  button {
    -webkit-tap-highlight-color: transparent;
    border: none;
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  .btn-primary {
    background: var(--accent);
    color: #05231d;
  }
  .btn-primary:disabled {
    background: #2a2d35;
    color: var(--muted);
  }
  .btn-secondary {
    background: #2a2d35;
    color: var(--text);
    margin-top: 8px;
  }
  .btn-stop {
    background: var(--danger);
    color: #2a0906;
    margin-top: 8px;
  }
  .device {
    background: #14161c;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .device-name {
    font-weight: 600;
    margin-bottom: 10px;
    font-size: 0.95rem;
  }
  .actuator {
    margin-bottom: 12px;
  }
  .actuator:last-child { margin-bottom: 0; }
  .actuator-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="range"] {
    width: 100%;
    height: 34px;
    accent-color: var(--accent);
  }
  #deviceList:empty::after {
    content: "尚未偵測到裝置";
    color: var(--muted);
    font-size: 0.85rem;
  }
  #log {
    background: #0b0c10;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 0.72rem;
    color: #9aa0ac;
    height: 160px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  label.field {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  input[type="text"] {
    width: 100%;
    background: #0b0c10;
    border: 1px solid #2a2d35;
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<h1>Intiface 連線測試</h1>
<div class="sub">透過 buttplug.js 連到手機上的 Intiface Central</div>

<div class="card">
  <div class="status-row">
    <div class="dot" id="statusDot"></div>
    <div id="statusText">尚未連線</div>
  </div>

  <label class="field" for="wsUrl">WebSocket 位址</label>
  <input type="text" id="wsUrl" value="ws://127.0.0.1:12345">

  <button class="btn-primary" id="connectBtn">連線</button>
  <button class="btn-secondary" id="scanBtn" disabled>開始掃描裝置</button>
  <button class="btn-stop" id="stopBtn" disabled>緊急停止全部</button>
</div>

<div class="card">
  <div class="device-name" style="margin-bottom:12px;">裝置</div>
  <div id="deviceList"></div>
</div>

<div class="card">
  <div class="device-name" style="margin-bottom:10px;">紀錄</div>
  <div id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/buttplug@5.0.0/dist/web/buttplug.js"></script>
<script>
// 不同版本的 buttplug.js 曝露的全域變數名稱不一致 (Buttplug / buttplug)，這裡兩個都嘗試抓
const BP = window.Buttplug || window.buttplug;

const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const connectBtn = document.getElementById('connectBtn');
const scanBtn = document.getElementById('scanBtn');
const stopBtn = document.getElementById('stopBtn');
const deviceList = document.getElementById('deviceList');
const logEl = document.getElementById('log');
const wsUrlInput = document.getElementById('wsUrl');

let client = null;
let connected = false;

function log(msg) {
  const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
  logEl.textContent += `[${time}] ${msg}\n`;
  logEl.scrollTop = logEl.scrollHeight;
}

function setConnected(isConnected) {
  connected = isConnected;
  statusDot.classList.toggle('connected', isConnected);
  statusText.textContent = isConnected ? '已連線到 Intiface Central' : '尚未連線';
  connectBtn.textContent = isConnected ? '中斷連線' : '連線';
  scanBtn.disabled = !isConnected;
  stopBtn.disabled = !isConnected;
  if (!isConnected) {
    deviceList.innerHTML = '';
  }
}

function renderDevice(device) {
  const wrapper = document.createElement('div');
  wrapper.className = 'device';

  const title = document.createElement('div');
  title.className = 'device-name';
  title.textContent = device.name;
  wrapper.appendChild(title);

  // --- 診斷輸出：把裝置物件實際長相印出來，方便排查 ---
  try {
    const ownKeys = Object.getOwnPropertyNames(device);
    const protoKeys = Object.getOwnPropertyNames(Object.getPrototypeOf(device) || {});
    log(`[診斷] ${device.name} 自身屬性: ${ownKeys.join(', ')}`);
    log(`[診斷] ${device.name} 方法: ${protoKeys.join(', ')}`);
    if (device.features) {
      try {
        const featureDump = [];
        for (const entry of device.features) {
          featureDump.push(JSON.stringify(entry, (k, v) => typeof v === 'function' ? '[fn]' : v));
        }
        log(`[診斷] features: ${featureDump.join(' | ')}`);
      } catch (e) { log(`[診斷] features 無法列舉: ${e.message}`); }
    }
    if (device.messageAttributes) {
      log(`[診斷] messageAttributes: ${JSON.stringify(device.messageAttributes)}`);
    }
    if (device.vibrateAttributes) {
      log(`[診斷] vibrateAttributes: ${JSON.stringify(device.vibrateAttributes)}`);
    }
  } catch (e) {
    log(`[診斷] 讀取裝置結構失敗: ${e.message}`);
  }

  // --- 建立通用送出函式，依序嘗試各種可能的 API 形狀 ---
  async function sendVibrate(index, value) {
    const attempts = [];

    // 形狀 A: v4/v5 features Map + runOutput(index, DeviceOutput.Vibrate.percent(x))
    if (BP.DeviceOutput && BP.DeviceOutput.Vibrate && typeof device.runOutput === 'function') {
      attempts.push(async () => device.runOutput(index, BP.DeviceOutput.Vibrate.percent(value)));
      attempts.push(async () => device.runOutput(BP.DeviceOutput.Vibrate.percent(value)));
    }
    // 形狀 B: v3 device.vibrate({index, scalar})
    if (typeof device.vibrate === 'function') {
      attempts.push(async () => device.vibrate({ index, scalar: value }));
      // 形狀 C: 單一數值 (部分 fork 版本，如 zendrex)
      attempts.push(async () => device.vibrate(value));
      // 形狀 D: 陣列形式 (多馬達裝置)
      attempts.push(async () => device.vibrate([value]));
    }

    let lastErr = null;
    for (const attempt of attempts) {
      try {
        await attempt();
        return true;
      } catch (e) {
        lastErr = e;
      }
    }
    if (lastErr) throw lastErr;
    throw new Error('找不到任何可用的震動控制方法');
  }

  async function sendStopDevice() {
    if (typeof device.stop === 'function') {
      return device.stop();
    }
    return sendVibrate(0, 0);
  }
  wrapper._stop = sendStopDevice;

  // --- 判斷要顯示幾條滑桿 ---
  let motorCount = 0;
  if (device.features) {
    try {
      for (const [, feature] of device.features) {
        if (feature.outputs && (feature.outputs.has ? feature.outputs.has('Vibrate') : feature.outputs['Vibrate'])) {
          motorCount++;
        }
      }
    } catch (e) { /* ignore, fall through */ }
  }
  if (motorCount === 0 && device.vibrateAttributes) {
    motorCount = device.vibrateAttributes.length || 0;
  }
  if (motorCount === 0 && device.messageAttributes && device.messageAttributes.ScalarCmd) {
    motorCount = device.messageAttributes.ScalarCmd.length || 0;
  }
  if (motorCount === 0 && typeof device.vibrate === 'function') {
    // 無法判斷馬達數量，但裝置有 vibrate 方法，至少給一條滑桿試試看
    motorCount = 1;
  }

  for (let idx = 0; idx < motorCount; idx++) {
    const row = document.createElement('div');
    row.className = 'actuator';

    const label = document.createElement('div');
    label.className = 'actuator-label';
    const valueSpan = document.createElement('span');
    valueSpan.textContent = '0%';
    label.innerHTML = `<span>震動馬達 ${idx}</span>`;
    label.appendChild(valueSpan);
    row.appendChild(label);

    const slider = document.createElement('input');
    slider.type = 'range';
    slider.min = '0';
    slider.max = '100';
    slider.value = '0';
    slider.addEventListener('input', () => {
      valueSpan.textContent = slider.value + '%';
    });
    slider.addEventListener('change', async () => {
      const strength = Number(slider.value) / 100;
      try {
        await sendVibrate(idx, strength);
        log(`${device.name} 馬達${idx} -> ${slider.value}%`);
      } catch (e) {
        log(`錯誤 (馬達${idx}): ${e.message}`);
      }
    });
    row.appendChild(slider);
    wrapper.appendChild(row);
  }

  if (motorCount === 0) {
    const note = document.createElement('div');
    note.style.color = 'var(--muted)';
    note.style.fontSize = '0.8rem';
    note.textContent = '此裝置沒有偵測到可控制的震動馬達（詳情請看下方紀錄）';
    wrapper.appendChild(note);
  }

  deviceList.appendChild(wrapper);
}

function refreshDeviceList() {
  deviceList.innerHTML = '';
  if (!client) return;
  client.devices.forEach(renderDevice);
}

connectBtn.addEventListener('click', async () => {
  if (connected) {
    try {
      await client.disconnect();
    } catch (e) {}
    setConnected(false);
    log('已中斷連線');
    return;
  }

  const url = wsUrlInput.value.trim();

  if (!BP) {
    log('錯誤: buttplug.js 函式庫未載入成功，請檢查網路連線或重新整理頁面');
    return;
  }

  log(`嘗試連線至 ${url} ...`);
  try {
    const connector = new BP.ButtplugBrowserWebsocketClientConnector(url);
    client = new BP.ButtplugClient('測試頁面');

    client.addListener('deviceadded', (device) => {
      log(`裝置已連接: ${device.name}`);
      refreshDeviceList();
    });
    client.addListener('deviceremoved', (device) => {
      log(`裝置已移除: ${device.name}`);
      refreshDeviceList();
    });
    client.addListener('disconnect', () => {
      log('與 Intiface Central 的連線已中斷');
      setConnected(false);
    });

    await client.connect(connector);
    setConnected(true);
    log('連線成功');
    refreshDeviceList();
  } catch (e) {
    log(`連線失敗: ${e.message}`);
    setConnected(false);
  }
});

scanBtn.addEventListener('click', async () => {
  if (!client) return;
  try {
    log('開始掃描裝置 (請確認 Epic Duo 已開機並在配對模式)...');
    await client.startScanning();
    setTimeout(async () => {
      try {
        await client.stopScanning();
        log('掃描結束');
      } catch (e) {}
    }, 8000);
  } catch (e) {
    log(`掃描失敗: ${e.message}`);
  }
});

stopBtn.addEventListener('click', async () => {
  if (!client) return;
  try {
    document.querySelectorAll('#deviceList .device').forEach(async (el) => {
      if (typeof el._stop === 'function') {
        try { await el._stop(); } catch (e) {}
      }
    });
    for (const [, device] of client.devices) {
      try {
        if (typeof device.stop === 'function') await device.stop();
      } catch (e) {}
    }
    log('已送出緊急停止指令');
    document.querySelectorAll('input[type="range"]').forEach(s => {
      s.value = 0;
      s.dispatchEvent(new Event('input'));
    });
  } catch (e) {
    log(`停止失敗: ${e.message}`);
  }
});

if (BP) {
  log('buttplug.js 已載入成功。請先在手機上開啟 Intiface Central 並按下播放鍵啟動伺服器。');
} else {
  log('警告: buttplug.js 尚未載入 (window.Buttplug / window.buttplug 皆不存在)，請重新整理頁面再試一次。');
}
</script>
</body>
</html>
